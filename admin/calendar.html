<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==================== PTT TSO ADMIN — SHARED CSS ==================== */
:root {
  --navy: #003B7A; --navy-dark: #002752; --sky: #1E90FF; --sky-soft: #DBEAFE;
  --orange: #FF6B00; --green: #16A34A; --red: #DC2626; --amber: #D97706;
  --gray-50: #F8FAFC; --gray-100: #F1F5F9; --gray-200: #E2E8F0;
  --gray-300: #CBD5E1; --gray-400: #94A3B8; --gray-500: #64748B;
  --gray-600: #475569; --gray-700: #334155; --gray-900: #0F172A;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  font-family: 'IBM Plex Sans Thai', system-ui, sans-serif;
  background: var(--gray-50); color: var(--gray-900);
  min-height: 100vh; line-height: 1.5; -webkit-font-smoothing: antialiased;
}

/* ==================== LAYOUT ==================== */
.layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  min-height: 100vh;
}

/* ==================== SIDEBAR ==================== */
.sidebar {
  background: linear-gradient(180deg, var(--navy-dark), var(--navy));
  color: white;
  padding: 24px 18px;
  display: flex; flex-direction: column;
  position: sticky; top: 0;
  height: 100vh;
}
.sidebar-logo {
  display: flex; align-items: center; gap: 12px;
  padding: 4px 8px 24px 8px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  margin-bottom: 18px;
}
.sidebar-logo-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, var(--sky), #60A5FA);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  box-shadow: 0 6px 14px rgba(30,144,255,0.35);
}
.brand { font-family: 'Outfit', sans-serif; font-size: 12px; letter-spacing: 2px; font-weight: 700; color: white; }
.brand-sub { font-family: 'Outfit', sans-serif; font-size: 9px; letter-spacing: 1.8px; color: rgba(255,255,255,0.55); margin-top: 2px; }
.sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 11px;
  color: rgba(255,255,255,0.7); text-decoration: none;
  font-size: 14px; font-weight: 500;
  transition: all 0.15s ease;
}
.nav-item:hover { background: rgba(255,255,255,0.08); color: white; }
.nav-item.active {
  background: rgba(255,255,255,0.12);
  color: white; font-weight: 600;
  box-shadow: inset 3px 0 0 var(--sky);
}
.nav-icon { font-size: 16px; }
.nav-label { flex: 1; }
.nav-badge {
  background: var(--red); color: white;
  padding: 2px 8px; border-radius: 100px;
  font-size: 11px; font-weight: 700;
  font-family: 'Outfit', sans-serif;
}
.sidebar-footer {
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-top: 18px;
}
.user-info {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px;
}
.user-avatar {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--orange), #FB923C);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px;
  font-family: 'Outfit', sans-serif;
}
.user-name { font-size: 13px; font-weight: 600; }
.user-role { font-size: 11px; color: rgba(255,255,255,0.5); }
.btn-logout {
  width: 100%; padding: 10px;
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.7);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  font-family: inherit; font-size: 12px;
  cursor: pointer; transition: all 0.15s;
}
.btn-logout:hover { background: rgba(220,38,38,0.2); color: white; border-color: rgba(220,38,38,0.4); }

/* ==================== MAIN ==================== */
.main {
  padding: 28px 32px 40px 32px;
  max-width: 1400px;
  width: 100%;
}
.topbar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 28px;
}
.page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
.page-subtitle { font-size: 14px; color: var(--gray-500); margin-top: 2px; }
.topbar-right { display: flex; gap: 10px; align-items: center; }
.division-filter {
  padding: 10px 14px; border: 1px solid var(--gray-200);
  border-radius: 10px; background: white;
  font-family: inherit; font-size: 13px; font-weight: 500;
  cursor: pointer; min-width: 140px;
}

/* ==================== STAT CARDS ==================== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px; margin-bottom: 24px;
}
.stat-card {
  background: white; border: 1px solid var(--gray-200);
  border-radius: 16px; padding: 18px 20px;
  text-decoration: none; color: inherit;
  transition: all 0.2s ease;
  display: flex; flex-direction: column; gap: 6px;
}
.stat-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(0,59,122,0.08);
  border-color: var(--sky);
}
.stat-card.urgent { border-left: 4px solid var(--red); }
.stat-card.success { border-left: 4px solid var(--green); }
.stat-card.neutral { border-left: 4px solid var(--sky); }
.stat-label { font-size: 13px; color: var(--gray-500); font-weight: 500; }
.stat-value {
  font-family: 'Outfit', sans-serif;
  font-size: 32px; font-weight: 700; letter-spacing: -1px;
  color: var(--gray-900);
}
.stat-fraction { font-size: 18px; color: var(--gray-400); font-weight: 500; }
.stat-trend { font-size: 12px; color: var(--gray-500); }

/* ==================== PANELS ==================== */
.panel {
  background: white; border: 1px solid var(--gray-200);
  border-radius: 16px; padding: 20px;
  margin-bottom: 18px;
}
.panel-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px;
}
.panel-header h3 { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
.link-more { font-size: 12px; color: var(--sky); text-decoration: none; font-weight: 600; }
.link-more:hover { color: var(--navy); }
.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

/* ==================== TABLES ==================== */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table thead th {
  text-align: left;
  padding: 8px 10px;
  background: var(--gray-50);
  color: var(--gray-500);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--gray-200);
}
.data-table tbody tr {
  cursor: pointer; transition: background 0.1s;
}
.data-table tbody tr:hover { background: var(--gray-50); }
.data-table tbody td {
  padding: 12px 10px;
  border-bottom: 1px solid var(--gray-100);
  color: var(--gray-700);
}
.data-table tbody tr:last-child td { border-bottom: none; }

/* ==================== TAGS / BADGES ==================== */
.tag {
  padding: 2px 8px; border-radius: 6px;
  font-size: 10px; font-weight: 700;
  font-family: 'Outfit', sans-serif;
  letter-spacing: 0.5px;
}
.tag-PO5 { background: #FEF3C7; color: #92400E; }
.tag-PO6 { background: #E0E7FF; color: #3730A3; }
.tag-PO7 { background: #DBEAFE; color: var(--navy); }
.tag-PO8 { background: #FCE7F3; color: #9D174D; }

.badge {
  padding: 3px 10px; border-radius: 100px;
  font-size: 11px; font-weight: 600;
}
.badge-blue { background: var(--sky-soft); color: var(--navy); }
.badge-green { background: #D1FAE5; color: #065F46; }
.badge-red { background: #FEE2E2; color: #991B1B; }
.badge-amber { background: #FEF3C7; color: #92400E; }
.badge-gray { background: var(--gray-100); color: var(--gray-600); }

/* ==================== ACTIVITY LIST ==================== */
.activity-list { list-style: none; }
.activity-list li {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 0;
  border-bottom: 1px solid var(--gray-100);
}
.activity-list li:last-child { border-bottom: none; }
.activity-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
.dot-green { background: var(--green); }
.dot-blue { background: var(--sky); }
.dot-orange { background: var(--orange); }
.dot-red { background: var(--red); }
.activity-body { flex: 1; }
.activity-title { font-size: 13px; color: var(--gray-900); }
.activity-meta { font-size: 11px; color: var(--gray-500); margin-top: 2px; }

/* ==================== BOTTOM NAV (mobile) ==================== */
.bottom-nav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  background: white;
  border-top: 1px solid var(--gray-200);
  padding: 8px 4px 12px 4px;
  z-index: 100;
  box-shadow: 0 -4px 16px rgba(0,0,0,0.04);
}
.bnav-item {
  flex: 1; text-align: center; padding: 6px 0;
  text-decoration: none; color: var(--gray-500);
  font-size: 10px; font-weight: 500;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  position: relative;
}
.bnav-item.active { color: var(--sky); }
.bnav-icon { font-size: 20px; }
.bnav-badge {
  position: absolute; top: 0; right: 24%;
  background: var(--red); color: white;
  font-size: 9px; padding: 1px 5px; border-radius: 100px;
  font-family: 'Outfit', sans-serif; font-weight: 700;
}

/* ==================== BUTTONS ==================== */
.btn {
  padding: 10px 18px;
  border: none; border-radius: 10px;
  font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.15s ease;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: linear-gradient(135deg, var(--navy), var(--sky)); color: white; box-shadow: 0 4px 10px rgba(0,59,122,0.2); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(0,59,122,0.3); }
.btn-ghost { background: white; color: var(--gray-700); border: 1px solid var(--gray-200); }
.btn-ghost:hover { background: var(--gray-50); border-color: var(--gray-300); }
.btn-danger { background: var(--red); color: white; }
.btn-warn { background: var(--amber); color: white; }
.btn-success { background: var(--green); color: white; }

/* ==================== EMPTY STATE ==================== */
.empty {
  text-align: center; padding: 40px 20px;
  color: var(--gray-400);
}
.empty-icon { font-size: 40px; margin-bottom: 10px; }
.empty-text { font-size: 13px; }

/* ==================== RESPONSIVE ==================== */
@media (max-width: 1100px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .two-col { grid-template-columns: 1fr; }
}

@media (max-width: 800px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .main { padding: 20px 16px 90px 16px; }
  .page-title { font-size: 20px; }
  .topbar { flex-direction: column; align-items: flex-start; gap: 10px; }
  .topbar-right { width: 100%; }
  .division-filter { width: 100%; }
  .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card { padding: 14px; }
  .stat-value { font-size: 24px; }
  .bottom-nav { display: flex; }
  .panel { padding: 16px; }
  .data-table thead { display: none; }
  .data-table tbody tr {
    display: block;
    padding: 10px 0;
    border-bottom: 1px solid var(--gray-100);
  }
  .data-table tbody td {
    display: inline-block;
    border: none; padding: 4px 8px;
    font-size: 13px;
  }
}

  .div-tag-lg { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 100px; background: linear-gradient(135deg, var(--navy), var(--sky)); color: white; font-weight: 700; font-family: 'Outfit', sans-serif; }
  .div-tag-lg .dot { width: 8px; height: 8px; background: #4ADE80; border-radius: 50%; box-shadow: 0 0 8px #4ADE80; }
  
  .cal-toolbar {

  }

  }
  .cal-nav { display: flex; gap: 6px; }
  .cal-nav button {
    width: 38px; height: 38px;
    border: 1px solid var(--gray-200);
    background: white; border-radius: 10px;
    cursor: pointer; font-size: 16px;

  }

  }
  .cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 4px; margin-bottom: 8px;
  }
  .cal-weekday {
    text-align: center; font-size: 11px; font-weight: 600;
    color: var(--gray-500); padding: 6px 0;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .cal-days {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-day {
    aspect-ratio: 1.2 / 1; min-height: 80px;

    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .cal-day:hover { background: var(--sky-soft); border-color: var(--sky); }
  .cal-day.other { background: transparent; color: var(--gray-300); cursor: default; }
  .cal-day.other:hover { background: transparent; border-color: transparent; }
  .cal-day.today { 
    background: linear-gradient(135deg, var(--navy), var(--sky));
    color: white; font-weight: 700;
  }
  .cal-day.today .cal-day-num { color: white; }
  .cal-day.selected {
    background: var(--navy); color: white;

  .cal-day-num {

  .cal-day-events { 
    flex: 1; margin-top: 4px;

  }
  .cal-event-pill {

  }
  .cal-event-pill.green { background: var(--green); }

  .cal-day.today .cal-event-more,

  .day-detail {

  }

  .day-detail .meta { color: var(--gray-500); font-size: 13px; margin-bottom: 14px; }

  @media (max-width: 800px) {
    .cal-day { aspect-ratio: 1 / 1; min-height: 50px; padding: 4px; }
    .cal-event-pill { font-size: 9px; padding: 1px 4px; }

  const body = { division: session.division, section };
  if (params) body.params = params;
  
  const resp = await fetch(ADMIN_API.GET_DATA_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-API-Key': ADMIN_API.API_KEY },
    body: JSON.stringify(body)
  });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return await resp.json();
}

async function callAction(action, requestId, params) {
  const session = getSession();
  if (!session) { window.location.href = 'login.html'; throw new Error('No session'); }
  const body = { division: session.division, action, requestId };
  if (params) body.params = params;
  
  const resp = await fetch(ADMIN_API.ACTION_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-API-Key': ADMIN_API.API_KEY },
    body: JSON.stringify(body)
  });
  if (!resp.ok) {
    const errText = await resp.text();
    throw new Error(`HTTP ${resp.status}: ${errText}`);
  }
  return await resp.json();
}

function getSession() {
  const raw = localStorage.getItem('ptt_admin_session');
  if (!raw) return null;
  try {
    const s = JSON.parse(raw);
    if (s.exp && new Date(s.exp).getTime() > Date.now()) return s;
    localStorage.removeItem('ptt_admin_session');
    return null;
  } catch { return null; }
}

function guardSession() {
  const s = getSession();
  if (!s) { window.location.href = 'login.html'; return null; }
  return s;
}

function logout() {
  if (confirm('ออกจากระบบ?')) {
    localStorage.removeItem('ptt_admin_session');
    window.location.href = 'login.html';
  }
}

// ===== Helpers =====
const TH_MONTHS_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MONTHS_LONG = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

function formatShortDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return `${d.getDate()} ${TH_MONTHS_SHORT[d.getMonth()]} ${(d.getFullYear()+543).toString().slice(-2)}`;
}

function formatThaiDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return `${d.getDate()} ${TH_MONTHS_LONG[d.getMonth()]} ${d.getFullYear()+543}`;
}

function relativeDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  const today = new Date();
  today.setHours(0,0,0,0);
  d.setHours(0,0,0,0);
  const diff = Math.round((d - today) / (1000*60*60*24));
  if (diff === 0) return 'วันนี้';
  if (diff === 1) return 'พรุ่งนี้';
  if (diff === -1) return 'เมื่อวาน';
  if (diff > 0 && diff <= 7) return `อีก ${diff} วัน`;
  return formatShortDate(iso);
}

function formatNid(nid) {
  if (!nid || nid.length !== 13) return nid;
  return `${nid[0]}-${nid.slice(1,5)}-${nid.slice(5,10)}-${nid.slice(10,12)}-${nid[12]}`;
}

function countTraineesByReq(trainees, requestId) {
  return (trainees || []).filter(t => t.RequestID === requestId).length;
}

// Empty/loading helpers
function showLoading(el, msg = 'กำลังโหลด...') {
  el.innerHTML = `<div style="text-align:center; padding:40px 20px; color:#94A3B8;">⏳ ${msg}</div>`;
}

function showError(el, msg) {
  el.innerHTML = `<div style="text-align:center; padding:40px 20px; color:#DC2626;">❌ ${msg}</div>`;
}


const STATUS_COLOR = { pending: 'amber', approved: '', done: 'green', cancelled: 'red' };
const STATUS_LABEL = { pending: 'รออนุมัติ', approved: 'นัดแล้ว', done: 'เสร็จสิ้น', cancelled: 'ยกเลิก' };
const TH_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

function normStatus(s) { return s ? s.toLowerCase() : 'pending'; }

const session = guardSession();
const DIVISION = session.division;
document.getElementById('divTag').textContent = DIVISION;
document.getElementById('avInit').textContent = DIVISION.replace('PO', 'P');
document.getElementById('avRole').textContent = `เขต ${DIVISION}`;

let EVENTS = {};
let TRAINEES = [];
let viewDate = new Date();
let selectedDate = null;

loadCalendar();

async function loadCalendar() {
  try {
    const data = await callGetData('calendar');
    const events = data.events || [];
    TRAINEES = data.trainees || [];
    
    // Group by date
    EVENTS = {};
    events.forEach(e => {
      if (!e.date) return;
      const key = e.date.split('T')[0]; // ensure yyyy-mm-dd
      if (!EVENTS[key]) EVENTS[key] = [];
      const people = countTraineesByReq(TRAINEES, e.id);
      EVENTS[key].push({
        id: e.id,
        company: e.company,
        contact: e.contact,
        time: e.time,
        people: people,
        status: normStatus(e.status)
      });
    });
    
    renderCalendar();
    selectDay(ymd(new Date()));
  } catch (err) {
    console.error(err);
    document.getElementById('calDays').innerHTML = `<div style="grid-column: 1 / -1; padding: 40px; text-align:center; color:#DC2626;">❌ โหลดข้อมูลไม่สำเร็จ: ${err.message}</div>`;
  }
}

function ymd(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function renderCalendar() {
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  document.getElementById('calMonth').textContent = `${TH_MONTHS[month]} ${year + 543}`;
  
  const first = new Date(year, month, 1);
  const last = new Date(year, month + 1, 0);
  const startDay = first.getDay();
  const daysInMonth = last.getDate();
  const today = new Date();
  const todayStr = ymd(today);
  
  const daysEl = document.getElementById('calDays');
  daysEl.innerHTML = '';
  
  const prevLast = new Date(year, month, 0).getDate();
  for (let i = startDay - 1; i >= 0; i--) {
    const d = document.createElement('div');
    d.className = 'cal-day other';
    d.innerHTML = `<div class="cal-day-num">${prevLast - i}</div>`;
    daysEl.appendChild(d);
  }
  
  for (let day = 1; day <= daysInMonth; day++) {
    const date = new Date(year, month, day);
    const key = ymd(date);
    const events = EVENTS[key] || [];
    const isToday = key === todayStr;
    const isSelected = selectedDate === key;
    
    const d = document.createElement('div');
    d.className = 'cal-day';
    if (isToday) d.classList.add('today');
    if (isSelected) d.classList.add('selected');
    
    let eventsHtml = '';
    const shown = events.slice(0, 2);
    shown.forEach(e => {
      const col = STATUS_COLOR[e.status] || '';
      eventsHtml += `<div class="cal-event-pill ${col}">${e.company || e.id}</div>`;
    });
    if (events.length > 2) eventsHtml += `<div class="cal-event-more">+${events.length - 2} เพิ่ม</div>`;
    
    d.innerHTML = `<div class="cal-day-num">${day}</div><div class="cal-day-events">${eventsHtml}</div>`;
    d.onclick = () => selectDay(key);
    daysEl.appendChild(d);
  }
  
  const totalCells = startDay + daysInMonth;
  const trailing = (7 - totalCells % 7) % 7;
  for (let i = 1; i <= trailing; i++) {
    const d = document.createElement('div');
    d.className = 'cal-day other';
    d.innerHTML = `<div class="cal-day-num">${i}</div>`;
    daysEl.appendChild(d);
  }
}

function selectDay(key) {
  selectedDate = key;
  renderCalendar();
  const events = EVENTS[key] || [];
  const [y, m, d] = key.split('-').map(Number);
  document.getElementById('dayDetailTitle').textContent = `📅 ${d} ${TH_MONTHS[m-1]} ${y+543}`;
  document.getElementById('dayDetailMeta').textContent = events.length === 0 ? 'ไม่มีอบรมในวันนี้' : `มีอบรม ${events.length} รายการ • รวม ${events.reduce((s,e)=>s+e.people,0)} คน`;
  
  const listEl = document.getElementById('eventList');
  if (events.length === 0) {
    listEl.innerHTML = '<div style="text-align:center; padding:30px; color:#94A3B8;">☕ ว่าง — ไม่มีอบรม</div>';
  } else {
    listEl.innerHTML = events.map(e => `
      <div class="event-item" onclick="window.location.href='request-detail.html?id=${e.id}'">
        <div class="event-icon">👥</div>
        <div class="event-body">
          <div class="event-title">${e.company || e.id}</div>
          <div class="event-meta">${e.people} คน • ${STATUS_LABEL[e.status]} • ${e.id}</div>
        </div>
      </div>
    `).join('');
  }
}

function prevMonth() { viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1); renderCalendar(); }
function nextMonth() { viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1); renderCalendar(); }
function goToday() { viewDate = new Date(); renderCalendar(); selectDay(ymd(new Date())); }
</script>
