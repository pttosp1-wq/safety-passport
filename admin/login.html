<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — PTT TSO Safety</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #003B7A; --navy-dark: #002752; --sky: #1E90FF;
    --orange: #FF6B00; --green: #16A34A; --red: #DC2626;
    --gray-50: #F8FAFC; --gray-100: #F1F5F9; --gray-200: #E2E8F0;
    --gray-400: #94A3B8; --gray-600: #475569; --gray-900: #0F172A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'IBM Plex Sans Thai', system-ui, sans-serif;
    background: linear-gradient(135deg, #003B7A 0%, #002752 100%);
    color: var(--gray-900); min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: white; border-radius: 24px; padding: 36px 28px;
    width: 100%; max-width: 420px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.3);
  }
  .logo { text-align: center; margin-bottom: 24px; }
  .logo-icon {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, var(--navy), var(--sky));
    border-radius: 18px; display: inline-flex;
    align-items: center; justify-content: center;
    color: white; font-size: 28px;
    box-shadow: 0 10px 24px rgba(0,59,122,0.3);
    margin-bottom: 12px;
  }
  .brand { font-family: 'Outfit', sans-serif; font-size: 11px; letter-spacing: 2.5px; color: var(--gray-400); font-weight: 600; margin-bottom: 4px; }
  .title { font-size: 22px; font-weight: 700; color: var(--gray-900); letter-spacing: -0.5px; }
  .subtitle { font-size: 13px; color: var(--gray-600); margin-top: 6px; }
  .form { margin-top: 28px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--gray-900); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 14px 16px;
    border: 2px solid var(--gray-200); border-radius: 12px;
    font-family: inherit; font-size: 16px;
    background: var(--gray-50); transition: all 0.2s;
  }
  .field input:focus {
    outline: none; border-color: var(--sky);
    background: white; box-shadow: 0 0 0 4px rgba(30,144,255,0.1);
  }
  .div-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .div-btn {
    padding: 14px 10px; background: var(--gray-50);
    border: 2px solid var(--gray-200); border-radius: 12px;
    cursor: pointer; transition: all 0.15s;
    font-family: 'Outfit', sans-serif; font-weight: 700;
    font-size: 15px; color: var(--gray-600);
  }
  .div-btn:hover { background: #DBEAFE; border-color: var(--sky); color: var(--navy); }
  .div-btn.active {
    background: linear-gradient(135deg, var(--navy), var(--sky));
    color: white; border-color: var(--navy);
    box-shadow: 0 6px 16px rgba(0,59,122,0.25);
  }
  .btn {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, var(--navy), var(--sky));
    color: white; border: none; border-radius: 12px;
    font-family: inherit; font-size: 16px; font-weight: 600;
    cursor: pointer; box-shadow: 0 6px 16px rgba(0,59,122,0.25);
    transition: all 0.2s ease;
  }
  .btn:hover { box-shadow: 0 8px 20px rgba(0,59,122,0.35); transform: translateY(-1px); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .error {
    background: #FEF2F2; color: var(--red);
    padding: 12px 14px; border-radius: 10px;
    font-size: 13px; margin-bottom: 12px;
    display: none;
  }
  .error.show { display: block; }
  .footer { text-align: center; margin-top: 24px; font-size: 11px; color: var(--gray-400); }
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <div class="logo-icon">🔒</div>
    <div class="brand">PTT • TSO ADMIN</div>
    <div class="title">เข้าสู่ระบบจัดการ</div>
    <div class="subtitle">เลือกเขตและกรอกรหัสผ่าน</div>
  </div>

  <div class="form">
    <div class="error" id="errMsg"></div>
    <div class="field">
      <label>เขตที่ดูแล</label>
      <div class="div-grid">
        <button type="button" class="div-btn" data-div="PO5" onclick="selectDiv('PO5')">PO5</button>
        <button type="button" class="div-btn" data-div="PO6" onclick="selectDiv('PO6')">PO6</button>
        <button type="button" class="div-btn active" data-div="PO7" onclick="selectDiv('PO7')">PO7</button>
        <button type="button" class="div-btn" data-div="PO8" onclick="selectDiv('PO8')">PO8</button>
      </div>
    </div>
    <div class="field">
      <label>รหัสผ่าน</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn" onclick="login()">เข้าสู่ระบบ →</button>
  </div>

  <div class="footer">
    ระบบจะจดจำการเข้าสู่ระบบ 30 วัน<br>
    แต่ละเขตเห็นข้อมูลเฉพาะของตัวเอง
  </div>
</div>

<script>
const FLOW_LOGIN_URL = 'https://defaultf2fda5e72ea1450d9fc12af5f86300.95.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/0267d02c96be49c89a610be47669fc3d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=yOaDgWY_viKnzDbJKF6_fq43Mn2spj2bFi513TP85LI';
const API_KEY = 'PTT-PO7-2026-SECRET';

let selectedDiv = 'PO7';

// ถ้า session valid อยู่ → redirect ไป dashboard เลย
const session = localStorage.getItem('ptt_admin_session');
if (session) {
  try {
    const data = JSON.parse(session);
    if (data.exp && new Date(data.exp).getTime() > Date.now()) {
      window.location.href = 'index.html';
    } else {
      localStorage.removeItem('ptt_admin_session');
    }
  } catch {
    localStorage.removeItem('ptt_admin_session');
  }
}

function selectDiv(div) {
  selectedDiv = div;
  document.querySelectorAll('.div-btn').forEach(b => b.classList.toggle('active', b.dataset.div === div));
}

document.getElementById('password').addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });

async function login() {
  const pwd = document.getElementById('password').value.trim();
  const errEl = document.getElementById('errMsg');
  const btn = document.getElementById('loginBtn');
  errEl.classList.remove('show');
  
  if (!pwd) {
    errEl.textContent = 'กรุณากรอกรหัสผ่าน';
    errEl.classList.add('show');
    return;
  }
  
  btn.disabled = true;
  btn.textContent = 'กำลังตรวจสอบ...';
  
  try {
    const resp = await fetch(FLOW_LOGIN_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-API-Key': API_KEY
      },
      body: JSON.stringify({ division: selectedDiv, password: pwd })
    });
    const data = await resp.json();
    
    if (resp.ok && data.ok && data.token) {
      // Save session
      localStorage.setItem('ptt_admin_session', JSON.stringify({
        token: data.token,
        division: data.division,
        exp: data.exp
      }));
      window.location.href = 'index.html';
    } else {
      errEl.textContent = data.message || 'รหัสผ่านหรือ Division ไม่ถูกต้อง';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'เข้าสู่ระบบ →';
    }
  } catch (err) {
    errEl.textContent = '❌ เชื่อมต่อระบบไม่ได้ — ' + err.message;
    errEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'เข้าสู่ระบบ →';
  }
}
</script>
</body>
</html>
