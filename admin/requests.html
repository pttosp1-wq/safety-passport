<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==================== PTT TSO ADMIN — SHARED CSS ==================== */
:root {
  --navy: #003B7A; --navy-dark: #002752; --sky: #1E90FF; --sky-soft: #DBEAFE;
  --orange: #FF6B00; --green: #16A34A; --red: #DC2626; --amber: #D97706;
  --gray-50: #F8FAFC; --gray-100: #F1F5F9; --gray-200: #E2E8F0;
  --gray-300: #CBD5E1; --gray-400: #94A3B8; --gray-500: #64748B;
  --gray-600: #475569; --gray-700: #334155; --gray-900: #0F172A;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  font-family: 'IBM Plex Sans Thai', system-ui, sans-serif;
  background: var(--gray-50); color: var(--gray-900);
  min-height: 100vh; line-height: 1.5; -webkit-font-smoothing: antialiased;
}

/* ==================== LAYOUT ==================== */
.layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  min-height: 100vh;
}

/* ==================== SIDEBAR ==================== */
.sidebar {
  background: linear-gradient(180deg, var(--navy-dark), var(--navy));
  color: white;
  padding: 24px 18px;
  display: flex; flex-direction: column;
  position: sticky; top: 0;
  height: 100vh;
}
.sidebar-logo {
  display: flex; align-items: center; gap: 12px;
  padding: 4px 8px 24px 8px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  margin-bottom: 18px;
}
.sidebar-logo-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, var(--sky), #60A5FA);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  box-shadow: 0 6px 14px rgba(30,144,255,0.35);
}
.brand { font-family: 'Outfit', sans-serif; font-size: 12px; letter-spacing: 2px; font-weight: 700; color: white; }
.brand-sub { font-family: 'Outfit', sans-serif; font-size: 9px; letter-spacing: 1.8px; color: rgba(255,255,255,0.55); margin-top: 2px; }
.sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 11px;
  color: rgba(255,255,255,0.7); text-decoration: none;
  font-size: 14px; font-weight: 500;
  transition: all 0.15s ease;
}
.nav-item:hover { background: rgba(255,255,255,0.08); color: white; }
.nav-item.active {
  background: rgba(255,255,255,0.12);
  color: white; font-weight: 600;
  box-shadow: inset 3px 0 0 var(--sky);
}
.nav-icon { font-size: 16px; }
.nav-label { flex: 1; }
.nav-badge {
  background: var(--red); color: white;
  padding: 2px 8px; border-radius: 100px;
  font-size: 11px; font-weight: 700;
  font-family: 'Outfit', sans-serif;
}
.sidebar-footer {
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-top: 18px;
}
.user-info {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px;
}
.user-avatar {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--orange), #FB923C);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px;
  font-family: 'Outfit', sans-serif;
}
.user-name { font-size: 13px; font-weight: 600; }
.user-role { font-size: 11px; color: rgba(255,255,255,0.5); }
.btn-logout {
  width: 100%; padding: 10px;
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.7);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  font-family: inherit; font-size: 12px;
  cursor: pointer; transition: all 0.15s;
}
.btn-logout:hover { background: rgba(220,38,38,0.2); color: white; border-color: rgba(220,38,38,0.4); }

/* ==================== MAIN ==================== */
.main {
  padding: 28px 32px 40px 32px;
  max-width: 1400px;
  width: 100%;
}
.topbar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 28px;
}
.page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
.page-subtitle { font-size: 14px; color: var(--gray-500); margin-top: 2px; }
.topbar-right { display: flex; gap: 10px; align-items: center; }
.division-filter {
  padding: 10px 14px; border: 1px solid var(--gray-200);
  border-radius: 10px; background: white;
  font-family: inherit; font-size: 13px; font-weight: 500;
  cursor: pointer; min-width: 140px;
}

/* ==================== STAT CARDS ==================== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px; margin-bottom: 24px;
}
.stat-card {
  background: white; border: 1px solid var(--gray-200);
  border-radius: 16px; padding: 18px 20px;
  text-decoration: none; color: inherit;
  transition: all 0.2s ease;
  display: flex; flex-direction: column; gap: 6px;
}
.stat-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(0,59,122,0.08);
  border-color: var(--sky);
}
.stat-card.urgent { border-left: 4px solid var(--red); }
.stat-card.success { border-left: 4px solid var(--green); }
.stat-card.neutral { border-left: 4px solid var(--sky); }
.stat-label { font-size: 13px; color: var(--gray-500); font-weight: 500; }
.stat-value {
  font-family: 'Outfit', sans-serif;
  font-size: 32px; font-weight: 700; letter-spacing: -1px;
  color: var(--gray-900);
}
.stat-fraction { font-size: 18px; color: var(--gray-400); font-weight: 500; }
.stat-trend { font-size: 12px; color: var(--gray-500); }

/* ==================== PANELS ==================== */
.panel {
  background: white; border: 1px solid var(--gray-200);
  border-radius: 16px; padding: 20px;
  margin-bottom: 18px;
}
.panel-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px;
}
.panel-header h3 { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
.link-more { font-size: 12px; color: var(--sky); text-decoration: none; font-weight: 600; }
.link-more:hover { color: var(--navy); }
.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

/* ==================== TABLES ==================== */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table thead th {
  text-align: left;
  padding: 8px 10px;
  background: var(--gray-50);
  color: var(--gray-500);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--gray-200);
}
.data-table tbody tr {
  cursor: pointer; transition: background 0.1s;
}
.data-table tbody tr:hover { background: var(--gray-50); }
.data-table tbody td {
  padding: 12px 10px;
  border-bottom: 1px solid var(--gray-100);
  color: var(--gray-700);
}
.data-table tbody tr:last-child td { border-bottom: none; }

/* ==================== TAGS / BADGES ==================== */
.tag {
  padding: 2px 8px; border-radius: 6px;
  font-size: 10px; font-weight: 700;
  font-family: 'Outfit', sans-serif;
  letter-spacing: 0.5px;
}
.tag-PO5 { background: #FEF3C7; color: #92400E; }
.tag-PO6 { background: #E0E7FF; color: #3730A3; }
.tag-PO7 { background: #DBEAFE; color: var(--navy); }
.tag-PO8 { background: #FCE7F3; color: #9D174D; }

.badge {
  padding: 3px 10px; border-radius: 100px;
  font-size: 11px; font-weight: 600;
}
.badge-blue { background: var(--sky-soft); color: var(--navy); }
.badge-green { background: #D1FAE5; color: #065F46; }
.badge-red { background: #FEE2E2; color: #991B1B; }
.badge-amber { background: #FEF3C7; color: #92400E; }
.badge-gray { background: var(--gray-100); color: var(--gray-600); }

/* ==================== ACTIVITY LIST ==================== */
.activity-list { list-style: none; }
.activity-list li {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 0;
  border-bottom: 1px solid var(--gray-100);
}
.activity-list li:last-child { border-bottom: none; }
.activity-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
.dot-green { background: var(--green); }
.dot-blue { background: var(--sky); }
.dot-orange { background: var(--orange); }
.dot-red { background: var(--red); }
.activity-body { flex: 1; }
.activity-title { font-size: 13px; color: var(--gray-900); }
.activity-meta { font-size: 11px; color: var(--gray-500); margin-top: 2px; }

/* ==================== BOTTOM NAV (mobile) ==================== */
.bottom-nav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  background: white;
  border-top: 1px solid var(--gray-200);
  padding: 8px 4px 12px 4px;
  z-index: 100;
  box-shadow: 0 -4px 16px rgba(0,0,0,0.04);
}
.bnav-item {
  flex: 1; text-align: center; padding: 6px 0;
  text-decoration: none; color: var(--gray-500);
  font-size: 10px; font-weight: 500;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  position: relative;
}
.bnav-item.active { color: var(--sky); }
.bnav-icon { font-size: 20px; }
.bnav-badge {
  position: absolute; top: 0; right: 24%;
  background: var(--red); color: white;
  font-size: 9px; padding: 1px 5px; border-radius: 100px;
  font-family: 'Outfit', sans-serif; font-weight: 700;
}

/* ==================== BUTTONS ==================== */
.btn {
  padding: 10px 18px;
  border: none; border-radius: 10px;
  font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.15s ease;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: linear-gradient(135deg, var(--navy), var(--sky)); color: white; box-shadow: 0 4px 10px rgba(0,59,122,0.2); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(0,59,122,0.3); }
.btn-ghost { background: white; color: var(--gray-700); border: 1px solid var(--gray-200); }
.btn-ghost:hover { background: var(--gray-50); border-color: var(--gray-300); }
.btn-danger { background: var(--red); color: white; }
.btn-warn { background: var(--amber); color: white; }
.btn-success { background: var(--green); color: white; }

/* ==================== EMPTY STATE ==================== */
.empty {
  text-align: center; padding: 40px 20px;
  color: var(--gray-400);
}
.empty-icon { font-size: 40px; margin-bottom: 10px; }
.empty-text { font-size: 13px; }

/* ==================== RESPONSIVE ==================== */
@media (max-width: 1100px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .two-col { grid-template-columns: 1fr; }
}

  .data-table thead { display: none; }
  .data-table tbody tr {
    display: block;
    padding: 10px 0;

  }
  .data-table tbody td {
    display: inline-block;
    border: none; padding: 4px 8px;
    font-size: 13px;
  }
}

  /* Filter tabs */

    display: flex; gap: 6px; margin-bottom: 16px;

  .ftab {

  }
  .ftab .count {
    background: rgba(255,255,255,0.25); 
    padding: 2px 8px; border-radius: 100px;
    margin-left: 6px; font-size: 11px; font-weight: 700;
  }
  .ftab:not(.active) .count { background: var(--gray-100); color: var(--gray-600); }
  
  .search-bar {

  .full-table { width: 100%; border-collapse: collapse; font-size: 13px; }

  .company-cell { font-weight: 600; color: var(--gray-900); }

</style>

<script>
// ==================== PTT TSO ADMIN — API CLIENT ====================
const ADMIN_API = {
  GET_DATA_URL: 'https://defaultf2fda5e72ea1450d9fc12af5f86300.95.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/c0356ad04b3b4659b10f8a92a5ec0357/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=E-AiSI63KsXw2UCUdpPdiDZLmV6K7bfFF1emGNbLcG0',
  ACTION_URL: 'https://defaultf2fda5e72ea1450d9fc12af5f86300.95.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/e2cf2966b3b6430a8ad00cab524583e9/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=oli6hDBwQO1SZSZSBQaJEUHmoygs1-tGvN33WUHMUd8',
  API_KEY: 'PTT-PO7-2026-SECRET'
};

async function callGetData(section, params) {
  const session = getSession();
  if (!session) { window.location.href = 'login.html'; throw new Error('No session'); }
  const body = { division: session.division, section };
  if (params) body.params = params;
  
  const resp = await fetch(ADMIN_API.GET_DATA_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-API-Key': ADMIN_API.API_KEY },
    body: JSON.stringify(body)
  });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return await resp.json();
}

async function callAction(action, requestId, params) {
  const session = getSession();
  if (!session) { window.location.href = 'login.html'; throw new Error('No session'); }
  const body = { division: session.division, action, requestId };
  if (params) body.params = params;
  
  const resp = await fetch(ADMIN_API.ACTION_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-API-Key': ADMIN_API.API_KEY },
    body: JSON.stringify(body)
  });
  if (!resp.ok) {
    const errText = await resp.text();
    throw new Error(`HTTP ${resp.status}: ${errText}`);
  }
  return await resp.json();
}

function getSession() {
  const raw = localStorage.getItem('ptt_admin_session');
  if (!raw) return null;
  try {
    const s = JSON.parse(raw);
    if (s.exp && new Date(s.exp).getTime() > Date.now()) return s;
    localStorage.removeItem('ptt_admin_session');
    return null;
  } catch { return null; }
}

function guardSession() {
  const s = getSession();
  if (!s) { window.location.href = 'login.html'; return null; }
  return s;
}

function logout() {
  if (confirm('ออกจากระบบ?')) {
    localStorage.removeItem('ptt_admin_session');
    window.location.href = 'login.html';
  }
}

// ===== Helpers =====
const TH_MONTHS_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MONTHS_LONG = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

function formatShortDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return `${d.getDate()} ${TH_MONTHS_SHORT[d.getMonth()]} ${(d.getFullYear()+543).toString().slice(-2)}`;
}

function formatThaiDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return `${d.getDate()} ${TH_MONTHS_LONG[d.getMonth()]} ${d.getFullYear()+543}`;
}

function relativeDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  const today = new Date();
  today.setHours(0,0,0,0);
  d.setHours(0,0,0,0);
  const diff = Math.round((d - today) / (1000*60*60*24));
  if (diff === 0) return 'วันนี้';
  if (diff === 1) return 'พรุ่งนี้';
  if (diff === -1) return 'เมื่อวาน';
  if (diff > 0 && diff <= 7) return `อีก ${diff} วัน`;
  return formatShortDate(iso);
}

function formatNid(nid) {
  if (!nid || nid.length !== 13) return nid;
  return `${nid[0]}-${nid.slice(1,5)}-${nid.slice(5,10)}-${nid.slice(10,12)}-${nid[12]}`;
}

function countTraineesByReq(trainees, requestId) {
  return (trainees || []).filter(t => t.RequestID === requestId).length;
}

// Empty/loading helpers
function showLoading(el, msg = 'กำลังโหลด...') {
  el.innerHTML = `<div style="text-align:center; padding:40px 20px; color:#94A3B8;">⏳ ${msg}</div>`;
}

function showError(el, msg) {
  el.innerHTML = `<div style="text-align:center; padding:40px 20px; color:#DC2626;">❌ ${msg}</div>`;
}


const STATUS_MAP = {
  pending: { label: 'รออนุมัติ', cls: 'badge-amber' },
  approved: { label: 'นัดแล้ว', cls: 'badge-blue' },
  done: { label: 'เสร็จสิ้น', cls: 'badge-green' },
  cancelled: { label: 'ยกเลิก', cls: 'badge-red' }
};

function normStatus(s) {
  if (!s) return 'pending';
  return s.toLowerCase();
}

const session = guardSession();
if (!session) throw new Error('no session');
const DIVISION = session.division;

document.getElementById('divTag').textContent = DIVISION;
document.getElementById('pageSub').textContent = `ทั้งหมดในเขต ${DIVISION}`;
document.getElementById('avInit').textContent = DIVISION.replace('PO', 'P');
document.getElementById('avRole').textContent = `เขต ${DIVISION}`;

let allReqs = [];
let allTrainees = [];
let currentFilter = 'all';

const urlStatus = new URLSearchParams(location.search).get('status');
if (urlStatus && STATUS_MAP[urlStatus]) currentFilter = urlStatus;

loadRequests();

async function loadRequests() {
  try {
    const data = await callGetData('requests');
    allReqs = data.requests || [];
    allTrainees = data.trainees || [];
    
    // counts
    const counts = { all: allReqs.length, pending: 0, approved: 0, done: 0, cancelled: 0 };
    allReqs.forEach(r => {
      const s = normStatus(r.status);
      if (counts[s] !== undefined) counts[s]++;
    });
    document.getElementById('cntAll').textContent = counts.all;
    document.getElementById('cntPending').textContent = counts.pending;
    document.getElementById('cntApproved').textContent = counts.approved;
    document.getElementById('cntDone').textContent = counts.done;
    document.getElementById('cntCancelled').textContent = counts.cancelled;
    document.getElementById('navBadge').textContent = counts.pending || '';
    document.getElementById('bBadge').textContent = counts.pending || '';
    if (!counts.pending) {
      document.getElementById('navBadge').style.display = 'none';
      document.getElementById('bBadge').style.display = 'none';
    }
    
    setFilter(currentFilter);
  } catch (err) {
    console.error(err);
    document.getElementById('tblBody').innerHTML = `<tr><td colspan="5" style="text-align:center; padding:40px; color:#DC2626;">❌ โหลดข้อมูลไม่สำเร็จ: ${err.message}</td></tr>`;
  }
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.ftab').forEach(t => t.classList.toggle('active', t.dataset.filter === f));
  renderTable();
}

function renderTable() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let rows = allReqs;
  if (currentFilter !== 'all') rows = rows.filter(r => normStatus(r.status) === currentFilter);
  if (q) rows = rows.filter(r => 
    (r.company || '').toLowerCase().includes(q) ||
    (r.contact || '').toLowerCase().includes(q) ||
    (r.id || '').toLowerCase().includes(q)
  );

  const tbody = document.getElementById('tblBody');
  const emptyEl = document.getElementById('emptyState');
  if (rows.length === 0) {
    tbody.innerHTML = '';
    emptyEl.style.display = 'block';
  } else {
    emptyEl.style.display = 'none';
    tbody.innerHTML = rows.map(r => {
      const s = normStatus(r.status);
      const sInfo = STATUS_MAP[s] || { label: r.status, cls: 'badge-gray' };
      const peopleCount = countTraineesByReq(allTrainees, r.id);
      return `
        <tr onclick="goReq('${r.id}')">
          <td class="company-cell">${r.company || '-'}<div class="sub">${r.contact || ''}</div></td>
          <td>${formatShortDate(r.preferredDate || r.scheduledDate)}</td>
          <td>${formatShortDate(r.scheduledDate)}</td>
          <td>${peopleCount}</td>
          <td><span class="badge ${sInfo.cls}">${sInfo.label}</span></td>
        </tr>
      `;
    }).join('');
  }
}

function goReq(id) { window.location.href = 'request-detail.html?id=' + id; }
</script>
