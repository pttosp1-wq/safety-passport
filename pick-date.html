<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>เลือกวันอบรม — PTT TSO</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #003B7A; --navy-dark: #002752; --sky: #1E90FF;
    --orange: #FF6B00; --green: #16A34A; --red: #DC2626; --amber: #D97706;
    --gray-50: #F8FAFC; --gray-100: #F1F5F9; --gray-200: #E2E8F0;
    --gray-400: #94A3B8; --gray-600: #475569; --gray-900: #0F172A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'IBM Plex Sans Thai', system-ui, sans-serif;
    background: var(--gray-50); color: var(--gray-900);
    min-height: 100vh; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 600px; margin: 0 auto; min-height: 100vh;
    display: flex; flex-direction: column; background: white;
    box-shadow: 0 0 60px rgba(0, 59, 122, 0.06);
  }
  .header {
    background: linear-gradient(135deg, var(--navy), var(--navy-dark));
    color: white; padding: 24px 20px; position: relative; overflow: hidden;
  }
  .header::before {
    content: ''; position: absolute; top: -50%; right: -20%;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(255,107,0,0.15), transparent 70%);
    border-radius: 50%;
  }
  .header-brand { font-family: 'Outfit', sans-serif; font-size: 10px; letter-spacing: 2.5px; color: rgba(255,255,255,0.6); margin-bottom: 6px; font-weight: 600; }
  .header-title { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; position: relative; }
  .reqid-tag {
    display: inline-block; margin-top: 6px;
    background: rgba(255,255,255,0.15); padding: 3px 12px;
    border-radius: 100px; font-family: 'Outfit', sans-serif;
    font-size: 11px; letter-spacing: 1px; font-weight: 600;
    backdrop-filter: blur(10px); position: relative;
  }
  .content { flex: 1; padding: 20px; }
  .section-title {
    font-size: 13px; font-weight: 700; color: var(--navy);
    letter-spacing: 0.3px; margin-bottom: 12px;
  }
  .cal-wrap {
    background: var(--gray-50); border: 1.5px solid var(--gray-200);
    border-radius: 14px; padding: 16px; margin-bottom: 20px;
  }
  .cal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-month { font-size: 15px; font-weight: 700; color: var(--gray-900); }
  .cal-nav {
    background: white; border: 1px solid var(--gray-200);
    width: 32px; height: 32px; border-radius: 8px;
    cursor: pointer; font-size: 16px; color: var(--gray-600);
    display: inline-flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
  }
  .cal-nav:hover { background: var(--navy); color: white; border-color: var(--navy); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-dow {
    text-align: center; font-size: 10px; font-weight: 700;
    color: var(--gray-400); padding: 4px 0; letter-spacing: 0.3px;
  }
  .cal-day {
    aspect-ratio: 1; background: white;
    border: 1px solid transparent; border-radius: 8px;
    font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600;
    color: var(--gray-900); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease; position: relative;
  }
  .cal-day:hover:not(.disabled) { border-color: var(--sky); background: #F0F9FF; }
  .cal-day.disabled { color: var(--gray-200); cursor: not-allowed; background: transparent; }
  .cal-day.weekend { color: var(--red); }
  .cal-day.holiday { color: var(--orange); }
  .cal-day.selected {
    background: linear-gradient(135deg, var(--navy), var(--sky));
    color: white !important; border-color: var(--navy);
    box-shadow: 0 4px 10px rgba(0,59,122,0.25);
  }
  .cal-day.today { font-weight: 800; }
  .cal-day.today::after {
    content: ''; position: absolute; bottom: 4px;
    width: 3px; height: 3px; border-radius: 50%;
    background: var(--orange);
  }
  .cal-day.selected.today::after { background: white; }
  .cal-legend {
    display: flex; gap: 12px; flex-wrap: wrap;
    margin-top: 12px; padding-top: 12px;
    border-top: 1px dashed var(--gray-200);
    font-size: 11px; color: var(--gray-600);
  }
  .cal-legend-item { display: inline-flex; align-items: center; gap: 4px; }
  .cal-legend-dot { width: 8px; height: 8px; border-radius: 50%; }
  .time-section {
    background: var(--gray-50); border: 1.5px solid var(--gray-200);
    border-radius: 14px; padding: 16px; margin-bottom: 20px;
  }
  .time-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .time-btn {
    background: white; border: 2px solid var(--gray-200);
    border-radius: 12px; padding: 14px 12px;
    font-family: inherit; font-size: 14px; font-weight: 600;
    color: var(--gray-900); cursor: pointer;
    transition: all 0.15s ease; text-align: center;
  }
  .time-btn:hover { border-color: var(--sky); background: #F0F9FF; }
  .time-btn.selected {
    background: linear-gradient(135deg, var(--navy), var(--sky));
    color: white; border-color: var(--navy);
    box-shadow: 0 4px 10px rgba(0,59,122,0.2);
  }
  .time-label-big {
    font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 800;
    letter-spacing: 0.5px; display: block; margin-bottom: 2px;
  }
  .time-label-small { font-size: 11px; opacity: 0.7; }
  .selected-summary {
    background: linear-gradient(135deg, #EFF6FF, #DBEAFE);
    border: 1px solid #93C5FD; color: var(--navy);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
    font-size: 14px; line-height: 1.5;
    display: none;
  }
  .selected-summary.show { display: block; }
  .selected-summary strong { display: block; font-size: 16px; margin-bottom: 4px; }
  .btn-primary {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, var(--navy), var(--sky));
    color: white; border: none; border-radius: 14px;
    font-family: inherit; font-size: 16px; font-weight: 600;
    cursor: pointer; box-shadow: 0 6px 16px rgba(0,59,122,0.25);
    transition: all 0.2s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary:hover:not(:disabled) { box-shadow: 0 8px 20px rgba(0,59,122,0.35); transform: translateY(-1px); }
  .btn-primary:disabled { background: var(--gray-200); color: var(--gray-400); cursor: not-allowed; box-shadow: none; }
  .btn-ghost {
    width: 100%; padding: 14px;
    background: transparent; color: var(--gray-600);
    border: none; border-radius: 12px;
    font-family: inherit; font-size: 14px; cursor: pointer;
    margin-top: 8px;
  }
  .footer { padding: 18px 20px; text-align: center; font-size: 11px; color: var(--gray-400); line-height: 1.6; border-top: 1px solid var(--gray-100); }
  .error-banner {
    background: linear-gradient(135deg, #FEE2E2, #FECACA);
    border-left: 4px solid var(--red); color: #7F1D1D;
    border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
    font-size: 14px; display: none;
  }
  .error-banner.show { display: block; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-brand">PTT • TSO SAFETY TRAINING</div>
    <div class="header-title">เลือกวันอบรมใหม่</div>
    <div class="reqid-tag" id="reqIdTag">REQ-XXX</div>
  </div>

  <div class="content">

    <div class="error-banner" id="errBanner"></div>

    <div class="section-title">📅 เลือกวันที่ต้องการ</div>
    <div class="cal-wrap">
      <div class="cal-header">
        <button type="button" class="cal-nav" id="calPrev">‹</button>
        <div class="cal-month" id="calMonth">-</div>
        <button type="button" class="cal-nav" id="calNext">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend">
        <span class="cal-legend-item"><span class="cal-legend-dot" style="background: var(--red);"></span>เสาร์-อาทิตย์</span>
        <span class="cal-legend-item"><span class="cal-legend-dot" style="background: var(--orange);"></span>วันหยุดราชการ</span>
      </div>
    </div>

    <div class="section-title">🕐 เลือกเวลา</div>
    <div class="time-section">
      <div class="time-options">
        <button type="button" class="time-btn selected" data-time="09:00" onclick="selectTime('09:00')">
          <span class="time-label-big">09:00</span>
          <span class="time-label-small">เช้า</span>
        </button>
        <button type="button" class="time-btn" data-time="13:00" onclick="selectTime('13:00')">
          <span class="time-label-big">13:00</span>
          <span class="time-label-small">บ่าย</span>
        </button>
      </div>
    </div>

    <div class="selected-summary" id="summary">
      <strong>📋 สรุปการเลือก</strong>
      <span id="summaryText">-</span>
    </div>

    <button class="btn-primary" id="confirmBtn" onclick="confirmDate()" disabled>✅ ยืนยันวันใหม่</button>
    <button class="btn-ghost" onclick="window.close()">ปิดหน้านี้</button>
  </div>

  <div class="footer">
    สายงานระบบท่อส่งก๊าซธรรมชาติ<br>
    ฝ่ายปฏิบัติการระบบท่อส่งก๊าซธรรมชาติ ภาค 2 (ปกต.2)
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const requestId = params.get('req') || '';
document.getElementById('reqIdTag').textContent = requestId || 'REQ-XXX';

if (!requestId) {
  const err = document.getElementById('errBanner');
  err.textContent = '⚠️ ไม่มี Request ID — โปรดเปิดลิงก์จากอีเมล';
  err.classList.add('show');
}

// ==================== CALENDAR ====================
// pick-date allows ALL days (including weekends, holidays) — จป. มีอำนาจเลือกวันใดก็ได้
const HOLIDAYS = {
  '2026-01-01': 'วันปีใหม่', '2026-02-03': 'วันมาฆบูชา', '2026-04-06': 'วันจักรี',
  '2026-04-13': 'วันสงกรานต์', '2026-04-14': 'วันสงกรานต์', '2026-04-15': 'วันสงกรานต์',
  '2026-05-01': 'วันแรงงาน', '2026-05-05': 'วันฉัตรมงคล', '2026-05-11': 'วันวิสาขบูชา',
  '2026-06-03': 'วันสมเด็จพระราชินี', '2026-07-09': 'วันอาสาฬหบูชา', '2026-07-10': 'วันเข้าพรรษา',
  '2026-07-28': 'วันรัชกาลที่ 10', '2026-08-12': 'วันแม่', '2026-10-13': 'วันรัชกาลที่ 9',
  '2026-10-23': 'วันปิยมหาราช', '2026-12-05': 'วันพ่อ', '2026-12-10': 'วันรัฐธรรมนูญ',
  '2026-12-31': 'สิ้นปี', '2027-01-01': 'วันปีใหม่'
};
const THAI_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
                     'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const THAI_MONTHS_SHORT = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.',
                           'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const THAI_DAYS = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];

const today = new Date(); today.setHours(0,0,0,0);
let calMonth = today.getMonth();
let calYear = today.getFullYear();
let calSelectedDate = null;
let calSelectedTime = '09:00';

function isoDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

function renderCalendar() {
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  document.getElementById('calMonth').textContent = `${THAI_MONTHS[calMonth]} ${calYear + 543}`;
  
  ['อา','จ','อ','พ','พฤ','ศ','ส'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    grid.appendChild(el);
  });
  
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  
  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div');
    el.className = 'cal-day disabled';
    grid.appendChild(el);
  }
  
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(calYear, calMonth, d);
    const iso = isoDate(date);
    const dow = date.getDay();
    const isWeekend = dow === 0 || dow === 6;
    const isHoliday = !!HOLIDAYS[iso];
    const isPast = date < today;
    const isToday = iso === isoDate(today);
    
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'cal-day';
    el.textContent = d;
    if (isWeekend) el.classList.add('weekend');
    if (isHoliday) el.classList.add('holiday');
    if (isToday) el.classList.add('today');
    if (isPast) {
      el.classList.add('disabled');
    } else {
      // จป. เลือกได้ทุกวัน (รวม weekend + holiday) — ตามเอกสาร HANDOFF
      el.addEventListener('click', () => selectDate(iso, date));
    }
    if (iso === calSelectedDate) el.classList.add('selected');
    grid.appendChild(el);
  }
}

function selectDate(iso, date) {
  calSelectedDate = iso;
  renderCalendar();
  updateSummary();
}

function selectTime(time) {
  calSelectedTime = time;
  document.querySelectorAll('.time-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.time === time);
  });
  updateSummary();
}

function updateSummary() {
  const btn = document.getElementById('confirmBtn');
  if (!calSelectedDate) {
    btn.disabled = true;
    document.getElementById('summary').classList.remove('show');
    return;
  }
  btn.disabled = false;
  const d = new Date(calSelectedDate);
  const txt = `${THAI_DAYS[d.getDay()]} ${d.getDate()} ${THAI_MONTHS_SHORT[d.getMonth()]} ${d.getFullYear()+543} เวลา ${calSelectedTime} น.`;
  document.getElementById('summaryText').textContent = txt;
  document.getElementById('summary').classList.add('show');
}

document.getElementById('calPrev').addEventListener('click', () => {
  calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
});
document.getElementById('calNext').addEventListener('click', () => {
  calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
});
renderCalendar();

function confirmDate() {
  if (!requestId) {
    const err = document.getElementById('errBanner');
    err.textContent = '⚠️ ไม่มี Request ID — โปรดเปิดลิงก์จากอีเมล';
    err.classList.add('show');
    return;
  }
  if (!calSelectedDate) return;
  
  // Redirect to confirmed.html — Flow 4 จะถูกเรียกที่นั่น
  const url = `confirmed.html?req=${encodeURIComponent(requestId)}&date=${encodeURIComponent(calSelectedDate)}&time=${encodeURIComponent(calSelectedTime)}&from=pick`;
  window.location.href = url;
}
</script>
</body>
</html>
